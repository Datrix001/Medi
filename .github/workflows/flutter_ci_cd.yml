name: Medi App CI/CD

# Trigger: runs on every push to main or any pull request
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─── JOB 1: Run Tests ─────────────────────────────────────────
  test:
    name: Run Flutter Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code onto the virtual machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 4: Generate code (json_serializable + flutter_gen)
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Step 5: Analyze code (like a linter)
      - name: Analyze
        run: flutter analyze

      # Step 6: Run tests
      - name: Run tests
        run: flutter test

  # ─── JOB 2: Build APK (only runs if tests pass) ───────────────
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test  # waits for test job to pass first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Setup Java (needed for Android build)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Build the APK
      - name: Build APK
        run: flutter build apk --release

      # Upload APK as a downloadable artifact
      # You can download it from GitHub Actions tab after build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medi-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
